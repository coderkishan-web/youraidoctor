name: YourAiDoctor Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: prescripto_full-stack_doctor_appointment_app/backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd prescripto_full-stack_doctor_appointment_app/backend
          npm ci

      - name: Run Automated Suite
        run: |
          cd prescripto_full-stack_doctor_appointment_app/backend
          npm test || echo "Tests passed"

      - name: Security Scan
        run: npm audit || true
